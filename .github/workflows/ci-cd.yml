name: CI/CD

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docs-sync:
    name: Sync AGENTS.md to CLAUDE.md
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Git
        uses: ./.github/actions/configure-git
        
      - name: Sync CLAUDE.md
        shell: pwsh
        run: ./tools/Scripts/Sync-AgentsToClaude.ps1
        
      - name: Commit and Push
        uses: ./.github/actions/commit-and-push
        with:
          path: 'CLAUDE.md'
          message: 'docs: auto-sync CLAUDE.md with AGENTS.md [skip ci]'

  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.CONFIGURATION }} -p:ContinuousIntegrationBuild=true --no-restore -p:GeneratePackageOnBuild=false

      - name: Test
        run: dotnet test --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .artifacts/
          include-hidden-files: true
          retention-days: 1
          
  check-changes:
    name: Check Changes
    runs-on: ubuntu-latest
    outputs:
      src_changed: ${{ steps.changes.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check for source code changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            src:
              - 'src/**'
              - 'tools/Documentation.Generator/**'
              - 'tools/Scripts/**'
              - '.github/workflows/ci-cd.yml'
              
  generate-api-docs:
    name: Generate & Sync API Docs
    needs: [build-and-test, docs-sync, check-changes]
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      needs.check-changes.outputs.src_changed == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .artifacts

      - name: Generate API Documentation
        shell: pwsh
        run: |
          $branch = if ([string]::IsNullOrEmpty($env:GITHUB_REF_NAME)) { 'main' } else { $env:GITHUB_REF_NAME }
          ./tools/Scripts/Generate-API-Documentation.ps1 -Branch $branch
          
      - name: Configure Git
        uses: ./.github/actions/configure-git
        
      - name: Commit and Push
        uses: ./.github/actions/commit-and-push
        with:
          path: 'docs/api'
          message: 'docs: update auto-generated API documentation [skip ci]'

  pack:
    name: Pack NuGet Packages
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .artifacts

      - name: Extract version from tag
        shell: pwsh
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          Write-Host "Tag: $tag -> Version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Pack
        run: dotnet pack -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: .artifacts/package/Release/

      # TODO: Publish to NuGet.org when ready
      # - name: Publish to NuGet
      #   run: dotnet nuget push .artifacts\package\Release\*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate

  create-release:
    name: Create GitHub Release
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            *.nupkg
            *.snupkg
